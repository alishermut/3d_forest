<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Fluid Spike — WebGPU MLS-MPM</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0d12; }
    canvas { display: block; }

    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
      color: #cfe6ff; background: rgba(8, 14, 22, 0.62);
      border: 1px solid rgba(120, 180, 255, 0.18);
      border-radius: 8px; padding: 10px 12px; min-width: 196px;
      backdrop-filter: blur(6px); user-select: none;
    }
    #hud .row { display: flex; justify-content: space-between; gap: 14px; }
    #hud .big { font-size: 20px; font-weight: 600; color: #fff; }
    #hud .lbl { opacity: 0.6; }
    #hud .val { font-variant-numeric: tabular-nums; }
    #hud hr { border: 0; border-top: 1px solid rgba(120,180,255,0.14); margin: 8px 0; }
    #hud input[type=range] { width: 100%; margin: 6px 0 2px; accent-color: #3aa0ff; }
    #hud .hint { opacity: 0.45; font-size: 11px; margin-top: 6px; }

    #fallback {
      position: fixed; inset: 0; z-index: 20; display: none;
      align-items: center; justify-content: center; text-align: center;
      color: #dbe7f5; font: 15px/1.6 system-ui, sans-serif;
      background: radial-gradient(circle at 50% 40%, #16202c, #0a0d12);
      padding: 24px;
    }
    #fallback h1 { font-size: 22px; margin: 0 0 10px; font-weight: 600; }
    #fallback code { color: #8ec5ff; }
  </style>
</head>
<body>
  <div id="hud">
    <div class="row"><span class="lbl">FPS</span><span class="big val" id="fps">—</span></div>
    <hr />
    <div class="row"><span class="lbl">particles</span><span class="val" id="pcount">—</span></div>
    <input type="range" id="pslider" min="4096" max="131072" step="4096" />
    <div class="row"><span class="lbl">frame</span><span class="val" id="ms">—</span></div>
    <div class="row"><span class="lbl">GPU</span><span class="val" id="gpu" style="max-width:120px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">—</span></div>
    <div class="hint">drag to swirl · scroll to zoom</div>
  </div>

  <div id="fallback">
    <div>
      <h1>WebGPU not available</h1>
      <p>This spike needs a WebGPU-capable browser (current Chrome or Edge).<br />
      Open it in one of those, or update your browser.<br />
      <span style="opacity:.5">The forest scene (<code>index.html</code>) runs on WebGL and is unaffected.</span></p>
    </div>
  </div>

  <script type="module" src="/src/spike/fluid.js"></script>
</body>
</html>
