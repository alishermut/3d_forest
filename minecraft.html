<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Voxelcraft — Minecraft clone</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #87ceeb;
    }
    body.playing, body.playing * { cursor: none !important; }
    canvas { display: block; }

    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 18px;
      height: 18px;
      margin: -9px 0 0 -9px;
      pointer-events: none;
      z-index: 10;
      mix-blend-mode: difference;
    }
    #crosshair::before, #crosshair::after {
      content: "";
      position: absolute;
      background: #ffffff;
    }
    #crosshair::before { left: 8px; top: 0; width: 2px; height: 18px; }
    #crosshair::after  { left: 0; top: 8px; width: 18px; height: 2px; }
    #crosshair.hidden { display: none; }

    #prompt {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      color: #eaf2ea;
      font: 16px/1.6 system-ui, sans-serif;
      background: rgba(8, 12, 10, 0.55);
      letter-spacing: 0.04em;
    }
    #prompt h1 {
      font-size: 28px;
      font-weight: 600;
      margin: 0 0 8px;
      letter-spacing: 0.08em;
    }
    #prompt p { margin: 0; opacity: 0.7; font-size: 14px; }
    #prompt.hidden { display: none; }

    #stats {
      position: fixed;
      top: 8px;
      left: 8px;
      z-index: 30;
      color: #dcefdc;
      font: 12px/1.5 Consolas, monospace;
      background: rgba(0, 0, 0, 0.45);
      padding: 6px 9px;
      border-radius: 4px;
      white-space: pre;
      pointer-events: none;
    }
    #stats.hidden { display: none; }

    #mode {
      position: fixed;
      top: 8px;
      right: 8px;
      z-index: 30;
      color: #ffe9b8;
      font: 12px/1.5 Consolas, monospace;
      background: rgba(0, 0, 0, 0.45);
      padding: 6px 9px;
      border-radius: 4px;
      pointer-events: none;
      letter-spacing: 0.12em;
    }
    #mode.hidden { display: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="crosshair" class="hidden"></div>
  <div id="prompt">
    <div>
      <h1>VOXELCRAFT</h1>
      <p>Click to enter &middot; WASD walk &middot; mouse to look &middot; F3 stats</p>
    </div>
  </div>
  <div id="stats" class="hidden"></div>
  <div id="mode" class="hidden">CREATIVE</div>
  <script type="module" src="/src/minecraft/main.js"></script>
</body>
</html>
